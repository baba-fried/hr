<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pre-Exam Details</title>
  <link rel="stylesheet" href="loader.css">
  <style>
    #pre-exam-container { max-width: 500px; margin: 40px auto; padding: 2rem; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h2 { margin-top: 1.5rem; }
    #begin-exam-btn { margin-top: 2rem; background: #2563eb; color: #fff; border: none; padding: 0.75rem 2rem; border-radius: 5px; font-size: 1.1rem; cursor: pointer; }
    #begin-exam-btn:hover { background: #1d4ed8; }
    p { margin: 0.5rem 0; }
  </style>
</head>
<body>
  <div id="pre-exam-container">
    <h2>Test Details</h2>
    <div id="test-details"></div>
    <h2>User Information</h2>
    <div id="user-details"></div>
    <button id="begin-exam-btn">Begin Exam</button>
  </div>
  <script src="pre-exam.js"></script>
</body>
</html>
