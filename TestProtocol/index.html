<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Take Test</title>
  <link rel="stylesheet" href="../user-dashboard/loader.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', Arial, sans-serif; background: #f3f4f6; margin: 0; padding: 0; }
    #main-exam-wrapper { min-height: 100vh; background: #f3f4f6; }
    .exam-header {
      position: sticky; top: 0; z-index: 10;
      background: #fff; border-bottom: 1px solid #e5e7eb;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem; box-shadow: 0 2px 8px rgba(37,99,235,0.04);
    }
    .exam-logo { height: 40px; }
    .exam-title { font-size: 1.5rem; font-weight: 700; color: #2563eb; letter-spacing: 1px; }
    .progress-bar-bg { width: 100%; height: 10px; background: #e5e7eb; border-radius: 5px; margin: 1.5rem 0 2rem 0; }
    .progress-bar-fill { height: 100%; background: #2563eb; border-radius: 5px; transition: width 0.3s; }
    #exam-container {
      border: 4px solid #2563eb; border-radius: 18px; box-shadow: 0 8px 32px rgba(37,99,235,0.12);
      margin: 40px auto 32px auto; max-width: 700px; background: #fff; padding: 2.5rem 2rem;
    }
    .question-card {
      background: #f8fafc; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      padding: 2rem 1.5rem; margin-bottom: 2rem; border: 1px solid #e5e7eb;
    }
    .question-number { color: #2563eb; font-weight: 600; font-size: 1.1rem; margin-bottom: 0.5rem; }
    .question-text { font-size: 1.2rem; font-weight: 600; margin-bottom: 1.2rem; color: #222; }
    .options { margin-bottom: 1.5rem; }
    .option { display: block; margin-bottom: 0.75rem; font-size: 1.05rem; }
    .option input[type="radio"] { margin-right: 0.7em; accent-color: #2563eb; }
    #submit-btn, #next-btn, #download-btn, #start-exam-btn, #close-popup-btn, #exit-btn {
      background: #2563eb; color: #fff; border: none; padding: 0.75rem 2rem; border-radius: 6px; font-size: 1.1rem; cursor: pointer; margin-right: 1rem; font-weight: 600;
    }
    #submit-btn:hover, #next-btn:hover, #download-btn:hover, #start-exam-btn:hover, #close-popup-btn:hover, #exit-btn:hover { background: #1d4ed8; }
    #result-section { margin-top: 2rem; text-align: center; }
    #exit-btn { background: #ef4444; margin-top: 2rem; }
    #exit-btn:hover { background: #dc2626; }
    #proctoring-container { position: fixed; top: 20px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; z-index: 100; }
    #webcam-feed { width: 180px; height: 130px; border: 2px solid #2563eb; border-radius: 8px; }
    #audio-level-container { width: 180px; height: 18px; background: #eee; border-radius: 5px; margin-top: 10px; }
    #audio-level { width: 0; height: 100%; background: #4caf50; border-radius: 5px; }
    .violation-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.18); z-index: 1000; display: none; min-width: 320px; }
    .popup-message { min-width: 260px; text-align: center; }
    @media (max-width: 800px) {
      #exam-container { padding: 1.2rem 0.5rem; }
      .exam-header { padding: 1rem 0.5rem; }
    }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>
  <div id="main-exam-wrapper">
    <div class="exam-header">
      <img src="../components/posspolelogo.png" alt="Posspole Logo" class="exam-logo" />
      <span class="exam-title" id="exam-title">Online Examination</span>
      <span style="font-size:1rem;color:#666;font-weight:500;">Proctored</span>
    </div>
    <div id="start-screen">
      <h1 style="font-size:2.2rem;font-weight:700;margin-bottom:0.5em;">Welcome to the Exam</h1>
      <p style="font-size:1.1rem;margin-bottom:2em;">Please read the instructions carefully before you begin.</p>
      <button id="start-exam-btn">Start Exam</button>
    </div>
    <div id="exam-container" style="border: 4px solid #2563eb; border-radius: 18px; box-shadow: 0 8px 32px rgba(37,99,235,0.12); margin: 40px auto 32px auto; max-width: 700px; background: #fff; padding: 2.5rem 2rem; display:none;">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar-fill" style="width:0%"></div></div>
      <div id="proctoring-container">
        <video id="webcam-feed" autoplay muted></video>
        <div id="audio-level-container">
          <div id="audio-level"></div>
        </div>
      </div>
      <div id="test-container">
        <div id="test-header" style="margin-bottom:1.5rem;"></div>
        <div id="question-section" style="display:none;">
          <div class="question-card">
            <div class="question-number" id="question-number"></div>
            <div class="question-text" id="question-text"></div>
            <form id="options-form" class="options"></form>
          </div>
          <button id="next-btn" style="display:none;">Next</button>
          <button id="submit-btn" style="display:none;">Submit</button>
        </div>
        <div id="result-section" style="display:none;"></div>
        <button id="exit-btn" style="display:none;">Exit</button>
      </div>
    </div>
    <div id="violation-popup" class="violation-popup">
      <h2>Violation Detected</h2>
      <p id="violation-message"></p>
      <button id="close-popup-btn">Close</button>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
