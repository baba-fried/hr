<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Take Test</title>
  <link rel="stylesheet" href="../user-dashboard/loader.css">
  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; }
    #test-container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 2rem; }
    .question { font-size: 1.2rem; margin-bottom: 1rem; }
    .options { margin-bottom: 1.5rem; }
    .option { display: block; margin-bottom: 0.5rem; }
    #submit-btn, #next-btn, #download-btn { background: #2563eb; color: #fff; border: none; padding: 0.75rem 2rem; border-radius: 5px; font-size: 1.1rem; cursor: pointer; margin-right: 1rem; }
    #submit-btn:hover, #next-btn:hover, #download-btn:hover { background: #1d4ed8; }
    #result-section { margin-top: 2rem; }
  </style>
</head>
<body>
  <div id="test-container">
    <div id="test-header"></div>
    <div id="question-section" style="display:none;">
      <div class="question" id="question-text"></div>
      <form id="options-form" class="options"></form>
      <button id="next-btn" style="display:none;">Next</button>
      <button id="submit-btn" style="display:none;">Submit</button>
    </div>
    <div id="result-section" style="display:none;"></div>
    <button id="exit-btn" style="display:none; margin-top: 1rem; background: #ef4444; color: #fff; border: none; padding: 0.75rem 2rem; border-radius: 5px; font-size: 1.1rem; cursor: pointer;">Exit</button>
  </div>
  <script src="index.js"></script>
</body>
</html>
