<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HR Dashboard - Posspole</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
    }

    .sidebar {
      background-color: black; 
      color: white;
      width: 240px;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
    }

    .sidebar a {
      color: white;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      border-radius: 0.5rem;
      transition: background 0.3s;
    }

    .sidebar a:hover {
      background-color: #1e232b;
    }

    .sidebar a.active {
      background-color: #374151;
      color: white;
    }

    .main-content {
      margin-left: 260px;
      padding: 2rem;
    }

    .download-btn {
      background-color: #000;
      color: white;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .download-btn:hover {
      background-color: #222;
      transform: scale(1.05);
    }

    footer {
      margin-top: 40px;
      background-color: #f9f9f9;
      padding: 20px;
      text-align: center;
      font-size: 14px;
      border-top: 1px solid #e2e2e2;
    }

    input, select, button {
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      background: black;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }
  </style>
</head>
<body>

 <!-- Sidebar -->
 <div class="sidebar">
  <img src="/components/posspolelogo.png" alt="Posspole Logo" class="h-6 mb-8 mx-auto">
  <a href="/HR-dashboard/hr.html" class="active hover:bg-gray-700 hover:text-white">Candidates</a>
  <a href="/HR-dashboard/test.html" class="hover:bg-gray-700 hover:text-white">Test</a>
  <a href="/HR-dashboard/report.html" class="hover:bg-gray-700 hover:text-white">Report</a>
  <a href="/login-page/login.html" id="logoutBtn" class="mt-auto hover:bg-gray-700 hover:text-white">Logout</a>
</div>

  <!-- Main Content -->
  <div class="main-content">
    <h1 class="text-4xl font-bold mb-6">HR Dashboard</h1>

    <!-- Permanent Test Dropdown -->
    <!-- Removed the Select Test dropdown as per user request -->
    
    <!-- Search and Filter -->
    <div class="mb-6 flex flex-col sm:flex-row sm:items-center gap-4 bg-white p-6 rounded-xl shadow border border-gray-200">
      <div class="relative w-full sm:w-72">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input type="text" id="searchName" placeholder="Search by Name" class="pl-10 pr-4 py-2 w-full border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-200 focus:border-blue-400 transition" />
      </div>
      <select id="sortBy" class="w-48 border border-gray-300 rounded-lg py-2 px-3 focus:ring-2 focus:ring-blue-200 focus:border-blue-400 transition">
        <option value="">Sort By</option>
        <option value="name-asc">Name A-Z</option>
        <option value="name-desc">Name Z-A</option>
      </select>
      <button onclick="applySearch()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-5 rounded-lg shadow-sm transition">Search</button>
      <button onclick="clearSearch()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-5 rounded-lg shadow-sm transition">Clear</button>
    </div>

    <!-- Users Table -->
    <div class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
      <h2 class="text-2xl font-semibold mb-4">Candidates</h2>
      <div class="overflow-x-auto">
        <table class="min-w-full text-left border-collapse">
          <thead class="bg-gray-100 font-semibold">
            <tr>
              <th class="p-3">User ID</th>
              <th class="p-3">Name</th>
              <th class="p-3">Email</th>
              <th class="p-3">Resume</th>
              <th class="p-3">Assign</th> <!-- New column -->
            </tr>
          </thead>
          <tbody id="userTable" class="divide-y">
            <!-- Rows go here -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Footer -->
    <footer>
      <p>About Us | <a href="https://posspole.com/" target="_blank" class="text-blue-600 underline">Visit Posspole</a></p>
      <p>&copy; 2025 Posspole. All rights reserved.</p>
    </footer>
  </div>

  <!-- JavaScript -->
  <script>
let tests = [];
let users = [];
let assignedCandidates = []; // userIds assigned to selected test

// Fetch all tests (for assign popup only)
async function fetchAllTests() {
  try {
    const res = await fetch("/api/tests");
    const data = await res.json();
    tests = Array.isArray(data.tests) ? data.tests : data;
  } catch (err) {
    tests = [];
  }
}

// Fetch users
async function fetchUsers() {
  try {
    const res = await fetch("/api/auth/hr/candidates");
    const data = await res.json();
    users = data.users;
    renderUsers(users);
    // No need to update assigned candidates for a selected test
  } catch (err) {
    console.error("Error fetching users:", err);
    alert("Failed to load candidates.");
  }
}

function renderUsers(data) {
  const table = document.getElementById("userTable");
  table.innerHTML = "";
  data.forEach(user => {
    // Count assigned tests for this user
    const numAssigned = Array.isArray(user.assignedTests) ? user.assignedTests.length : 0;
    table.innerHTML += `
      <tr>
        <td class="p-3">${user._id}</td>
        <td class="p-3">${user.fullName}</td>
        <td class="p-3">${user.email}</td>
        <td class="p-3">
          <a href="${user.resumeUrl || '#'}" class="download-btn" download>Download</a>
        </td>
        <td class="p-3 flex items-center gap-2">
          <button class="assign-candidate-btn bg-blue-600 text-white px-3 py-1 rounded"
            data-user-id="${user._id}" data-user-name="${user.fullName}" data-user-email="${user.email}">
            Assign
          </button>
          <button class="view-assigned-btn bg-green-50 border border-green-400 text-green-700 font-semibold px-3 py-1 rounded hover:bg-green-100 transition" data-user-id="${user._id}" data-user-name="${user.fullName}">
            View (${numAssigned})
          </button>
        </td>
      </tr>
    `;
  });
}

function parseTime(timeStr) {
  const [time, meridian] = timeStr.split(" ");
  let [hours, minutes] = time.split(":").map(Number);
  if (meridian === "PM" && hours !== 12) hours += 12;
  if (meridian === "AM" && hours === 12) hours = 0;
  return hours * 60 + minutes;
}

function applySearch() {
  const nameInput = document.getElementById("searchName").value.toLowerCase();
  const sortBy = document.getElementById("sortBy").value;

  let filtered = users.filter(user =>
    (user.fullName || user.name || '').toLowerCase().includes(nameInput)
  );

  switch (sortBy) {
    case "name-asc":
      filtered.sort((a, b) => (a.fullName || a.name).localeCompare(b.fullName || b.name));
      break;
    case "name-desc":
      filtered.sort((a, b) => (b.fullName || b.name).localeCompare(a.fullName || a.name));
      break;
  }

  renderUsers(filtered);
}

function clearSearch() {
  document.getElementById("searchName").value = "";
  document.getElementById("sortBy").value = "";
  renderUsers(users);
}

window.onload = async () => {
  await fetchAllTests();
  await fetchUsers();
};

// Assign button logic with test selection modal
let assignPopup = null;
let assignPopupBackdrop = null;

document.addEventListener('click', async function(e) {
  if (e.target.classList.contains('assign-candidate-btn')) {
    const btn = e.target;
    const userId = btn.getAttribute('data-user-id');
    const userName = btn.getAttribute('data-user-name');
    const userEmail = btn.getAttribute('data-user-email');
    // Always fetch latest tests for popup dropdown
    await fetchAllTests();

    // Remove any existing popup
    if (assignPopup) assignPopup.remove();
    if (assignPopupBackdrop) assignPopupBackdrop.remove();

    // Create backdrop
    assignPopupBackdrop = document.createElement('div');
    assignPopupBackdrop.style.position = 'fixed';
    assignPopupBackdrop.style.top = 0;
    assignPopupBackdrop.style.left = 0;
    assignPopupBackdrop.style.width = '100vw';
    assignPopupBackdrop.style.height = '100vh';
    assignPopupBackdrop.style.background = 'rgba(0,0,0,0.4)';
    assignPopupBackdrop.style.zIndex = 9998;
    document.body.appendChild(assignPopupBackdrop);

    // Create popup
    assignPopup = document.createElement('div');
    assignPopup.style.position = 'fixed';
    assignPopup.style.top = '50%';
    assignPopup.style.left = '50%';
    assignPopup.style.transform = 'translate(-50%, -50%)';
    assignPopup.style.background = '#fff';
    assignPopup.style.padding = '2rem 2.5rem';
    assignPopup.style.borderRadius = '12px';
    assignPopup.style.boxShadow = '0 8px 32px rgba(0,0,0,0.18)';
    assignPopup.style.zIndex = 9999;
    assignPopup.style.maxWidth = '350px';
    assignPopup.style.textAlign = 'center';

    // Build test dropdown for popup
    let testOptions = tests.length
      ? tests.map(t => `<option value="${t._id}">${t.name}</option>`).join('')
      : `<option disabled>No tests available</option>`;

    assignPopup.innerHTML = `
      <button id="close-assign-popup" style="position:absolute;top:10px;right:16px;font-size:22px;background:none;border:none;cursor:pointer;color:#888;">&times;</button>
      <h2 class="text-xl font-bold mb-4">Assign Test</h2>
      <p class="mb-2"><strong>Candidate:</strong> ${userName} (${userEmail})</p>
      <div class="mb-4">
        <label for="assign-test-select" class="block mb-1 font-semibold">Select Test</label>
        <select id="assign-test-select" class="w-full p-2 border border-gray-300 rounded">
          ${testOptions}
        </select>
      </div>
      <div class="flex gap-2 justify-center mt-6">
        <button id="confirm-assign-popup" class="bg-black text-white px-4 py-2 rounded">Assign</button>
        <button id="cancel-assign-popup" class="bg-gray-300 text-black px-4 py-2 rounded">Cancel</button>
      </div>
    `;
    document.body.appendChild(assignPopup);

    // Close (X) button handler
    document.getElementById('close-assign-popup').onclick = function() {
      assignPopup.remove();
      assignPopupBackdrop.remove();
    };

    // Cancel handler
    document.getElementById('cancel-assign-popup').onclick = function() {
      assignPopup.remove();
      assignPopupBackdrop.remove();
    };

    // Confirm handler
    document.getElementById('confirm-assign-popup').onclick = async function() {
      const select = document.getElementById('assign-test-select');
      const testId = select.value;
      const testName = select.options[select.selectedIndex]?.text || 'Test';
      if (!testId) {
        alert('Please select a test.');
        return;
      }
      const confirmBtn = document.getElementById('confirm-assign-popup');
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Assigning...';
      try {
        const res = await fetch(`/api/tests/${testId}/assign`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({userId})
        });
        const result = await res.json();
        if (res.ok) {
          alert('Assignment email sent to ' + userName + ' for test "' + testName + '"!');
          assignPopup.remove();
          assignPopupBackdrop.remove();
        } else {
          confirmBtn.textContent = 'Assign';
          confirmBtn.disabled = false;
          alert(result.message || 'Failed to assign test.');
        }
      } catch (err) {
        confirmBtn.textContent = 'Assign';
        confirmBtn.disabled = false;
        alert('Network error.');
      }
    };
  }
});

// Listen for test creation form submission and refresh tests list after creation
// (Assume the form has id='create-test-form')
const createTestForm = document.getElementById('create-test-form');
if (createTestForm) {
  createTestForm.addEventListener('submit', async function(e) {
    e.preventDefault();
    // ...existing form submission logic...
    // After successful creation:
    await fetchAllTests();
    // Optionally, show a notification or reset the form
  });
}

// Add event delegation for .view-assigned-btn click to open the assigned tests popup
// (Place after the existing event delegation for assign-status)
document.addEventListener('click', function(e) {
  const btn = e.target.closest('.view-assigned-btn');
  if (btn) {
    const userId = btn.getAttribute('data-user-id');
    const userName = btn.getAttribute('data-user-name');
    if (userId) {
      showAssignedTestsPopup(userId, userName);
    }
  }
});

// Universal logout confirmation for all HR-dashboard pages
function setupLogoutButton() {
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', function (e) {
            e.preventDefault();
            // Use a custom modal for confirmation with Cancel/Logout buttons
            if (document.getElementById('logout-modal')) return; // Prevent multiple modals

            const modal = document.createElement('div');
            modal.id = 'logout-modal';
            modal.style.position = 'fixed';
            modal.style.top = 0;
            modal.style.left = 0;
            modal.style.width = '100vw';
            modal.style.height = '100vh';
            modal.style.background = 'rgba(0,0,0,0.4)';
            modal.style.display = 'flex';
            modal.style.alignItems = 'center';
            modal.style.justifyContent = 'center';
            modal.style.zIndex = 9999;
            modal.innerHTML = `
              <div style="background:#fff;padding:2rem 2.5rem;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.18);max-width:350px;text-align:center;">
                <h2 class="text-xl font-bold mb-4">Log out?</h2>
                <p class="mb-6">Are you sure you want to log out?</p>
                <div style="display:flex;gap:1rem;justify-content:center;">
                  <button id="cancel-logout" style="padding:0.5rem 1.5rem;border-radius:8px;background:#e5e7eb;color:#222;border:none;font-weight:500;cursor:pointer;">Cancel</button>
                  <button id="confirm-logout" style="padding:0.5rem 1.5rem;border-radius:8px;background:#000;color:#fff;border:none;font-weight:500;cursor:pointer;">Logout</button>
                </div>
              </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('cancel-logout').onclick = function() {
                document.body.removeChild(modal);
            };
            document.getElementById('confirm-logout').onclick = function() {
                localStorage.clear();
                sessionStorage.clear();
                window.location.href = '/login-page/login.html';
            };
        });
    }
}
setupLogoutButton();

async function showAssignedTestsPopup(userId, userName) {
  // Remove any existing popup
  const existing = document.getElementById('assigned-tests-popup');
  const existingBackdrop = document.getElementById('assigned-tests-popup-backdrop');
  if (existing) existing.remove();
  if (existingBackdrop) existingBackdrop.remove();

  // Create backdrop
  const backdrop = document.createElement('div');
  backdrop.id = 'assigned-tests-popup-backdrop';
  backdrop.style.position = 'fixed';
  backdrop.style.top = 0;
  backdrop.style.left = 0;
  backdrop.style.width = '100vw';
  backdrop.style.height = '100vh';
  backdrop.style.background = 'rgba(0,0,0,0.4)';
  backdrop.style.zIndex = 9998;
  document.body.appendChild(backdrop);

  // Create popup
  const popup = document.createElement('div');
  popup.id = 'assigned-tests-popup';
  popup.style.position = 'fixed';
  popup.style.top = '50%';
  popup.style.left = '50%';
  popup.style.transform = 'translate(-50%, -50%)';
  popup.style.background = '#fff';
  popup.style.padding = '2rem 2.5rem';
  popup.style.borderRadius = '12px';
  popup.style.boxShadow = '0 8px 32px rgba(0,0,0,0.18)';
  popup.style.zIndex = 9999;
  popup.style.maxWidth = '400px';
  popup.style.textAlign = 'center';

  popup.innerHTML = `
    <button id="close-assigned-tests-popup" style="position:absolute;top:10px;right:16px;font-size:22px;background:none;border:none;cursor:pointer;color:#888;">&times;</button>
    <h2 class="text-xl font-bold mb-4">Assigned Tests</h2>
    <p class="mb-2"><strong>Candidate:</strong> ${userName}</p>
    <div id="assigned-tests-list" class="mb-4">Loading...</div>
    <div class="flex gap-2 justify-center mt-6">
      <button id="close-assigned-tests-popup-btn" class="bg-gray-300 text-black px-4 py-2 rounded">Close</button>
    </div>
  `;
  document.body.appendChild(popup);

  // Close handlers
  document.getElementById('close-assigned-tests-popup').onclick = function() {
    popup.remove();
    backdrop.remove();
  };
  document.getElementById('close-assigned-tests-popup-btn').onclick = function() {
    popup.remove();
    backdrop.remove();
  };

  // Fetch assigned tests for this user
  try {
    const res = await fetch(`/api/users/${userId}/assigned-tests`);
    const data = await res.json();
    const listDiv = document.getElementById('assigned-tests-list');
    if (res.ok && Array.isArray(data.assignedTests) && data.assignedTests.length) {
      listDiv.innerHTML = `<ul style='text-align:left;max-height:200px;overflow:auto;padding-left:1.2em;'>` +
        data.assignedTests.map(t => `<li style='margin-bottom:0.5em;'><strong>${t.name}</strong>${t.assignedAt ? ` <span style='color:#888;font-size:0.9em;'>(Assigned: ${new Date(t.assignedAt).toLocaleString()})</span>` : ''}</li>`).join('') +
        `</ul>`;
    } else {
      listDiv.textContent = 'No tests assigned.';
    }
  } catch (err) {
    const listDiv = document.getElementById('assigned-tests-list');
    listDiv.textContent = 'Failed to load assigned tests.';
  }
}
  </script>
  <script src="/user-dashboard/user-page.js"></script>
</body>
</html>
